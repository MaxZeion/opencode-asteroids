# MiniMax Code (Mavis) — review de PRs en GitHub.
# Secreto necesario: MINIMAX_API_KEY.
name: minimax

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  minimax:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install MiniMax Code CLI
        # El instalador oficial deja `mcode` en una ruta que NO está en el PATH
        # por defecto del runner (la añade en ~/.bashrc, que los steps `run:`
        # no cargan). Localizamos el binario y lo propagamos a los siguientes
        # steps vía $GITHUB_PATH.
        run: |
          curl -fsSL https://filecdn.minimax.chat/public/install.sh | bash
          MCODE_BIN="$(find "$HOME" /usr/local -maxdepth 6 -name mcode -type f -executable 2>/dev/null | head -n1)"
          if [ -z "$MCODE_BIN" ]; then
            echo "::error::mcode no encontrado tras el install"
            echo "PATH=$PATH"
            ls -la "$HOME/.local/bin" "$HOME/.mcode/bin" 2>/dev/null || true
            exit 1
          fi
          echo "MCODE_BIN=$MCODE_BIN"
          MCODE_DIR="$(dirname "$MCODE_BIN")"
          echo "$MCODE_DIR" >> "$GITHUB_PATH"
          "$MCODE_BIN" --version

      - name: Configure MiniMax API key
        # `mcode exec` lee la key del config que crea este subcomando,
        # no del entorno. Hay que llamarlo tras el install.
        env:
          MCODE_PROVIDER_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: mcode provider set-minimax-key

      - name: Run MiniMax Code review
        run: |
          mcode exec \
            --output-format json \
            --cwd "$GITHUB_WORKSPACE" \
            --timeout 10m \
            "Revisa los cambios de este PR siguiendo AGENTS.md (canvas 800x600, wrap toroidal, puntuación large=20/medium=50/small=100, cero dependencias, todo en un solo game.js). Reporta en español."
