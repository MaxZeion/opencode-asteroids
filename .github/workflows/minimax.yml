# MiniMax Code (Mavis) — review de PRs en GitHub.
# Secreto necesario: MINIMAX_API_KEY.
#
# Usamos `pull_request` porque `anomalyco/opencode/github` no soporta
# `pull_request_target`. El job se limita a PRs del mismo repositorio para
# que los secretos no se expongan a forks.
#
# Usamos la GitHub Action oficial `anomalyco/opencode/github` (la misma que
# `opencode.yml`) en lugar de `mcode exec` directo, porque `mcode exec` en
# CI requiere `mcode login` con flujo de browser interactivo, lo cual no
# es viable en runners. La action maneja la auth por su cuenta.
name: minimax

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  minimax:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false

      - name: Run MiniMax Code review
        uses: anomalyco/opencode/github@16747470f976aca3d362ad730bcd3fe82ecc2c9a # v1.18.29
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MCODE_PROVIDER_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        with:
          model: minimax/MiniMax-M3
          prompt: |
            Revisa los cambios de este PR siguiendo AGENTS.md:
            - Canvas fijo en 800x600.
            - Espacio con wrap toroidal (conservar topología al tocar movimiento/colisiones).
            - Puntuación: large=20, medium=50, small=100 (no cambiar sin motivo).
            - Cero dependencias: todo en un solo game.js.
            Reporta en español.
