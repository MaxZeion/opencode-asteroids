# MiniMax Code (Mavis) — review de PRs en GitHub.
# Secreto necesario: MINIMAX_API_KEY.
name: minimax

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  minimax:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        # `mcode` requiere Node 22.19+ o 24-26.
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install MiniMax Code CLI
        # Cada step `run:` abre un shell con su propio PATH; el directorio
        # de binarios globales de npm NO siempre se hereda. Lo localizamos
        # y lo propagamos explícitamente con $GITHUB_PATH.
        run: |
          npm install -g @minimax-ai/code
          MCODE_BIN_DIR="$(npm bin -g)"
          MCODE_BIN="$MCODE_BIN_DIR/mcode"
          echo "MCODE_BIN_DIR=$MCODE_BIN_DIR"
          echo "MCODE_BIN=$MCODE_BIN"
          if [ ! -x "$MCODE_BIN" ]; then
            echo "::error::mcode no se enlazó tras npm install (postinstall pudo fallar)"
            ls -la "$MCODE_BIN_DIR" | head -20
            echo "---"
            echo "npm root -g:"; npm root -g
            echo "ls del paquete:"; ls -la "$(npm root -g)/@minimax-ai/code" 2>&1 | head -20
            exit 1
          fi
          echo "$MCODE_BIN_DIR" >> "$GITHUB_PATH"
          "$MCODE_BIN" --version

      - name: Configure MiniMax API key
        env:
          MCODE_PROVIDER_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: mcode provider set-minimax-key

      - name: Run MiniMax Code review
        run: |
          mcode exec \
            --output-format json \
            --cwd "$GITHUB_WORKSPACE" \
            --timeout 10m \
            "Revisa los cambios de este PR siguiendo AGENTS.md (canvas 800x600, wrap toroidal, puntuación large=20/medium=50/small=100, cero dependencias, todo en un solo game.js). Reporta en español."
