# MiniMax Code (Mavis) — review de PRs en GitHub.
# Secreto necesario: MINIMAX_API_KEY.
name: minimax

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  minimax:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        # `mcode` requiere Node 22.19+ o 24/25/26; el runner trae una LTS
        # más vieja, así que fijamos una compatible.
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install MiniMax Code CLI
        # npm deja el binario en $(npm bin -g) que YA está en PATH del runner.
        # Mucho más determinista que el curl|bash oficial (que requiere
        # build-essential/python3 y puede fallar silenciosamente).
        run: |
          npm install -g @minimax-ai/code
          mcode --version

      - name: Configure MiniMax API key
        # `mcode exec` lee la key del config que crea este subcomando,
        # no del entorno.
        env:
          MCODE_PROVIDER_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: mcode provider set-minimax-key

      - name: Run MiniMax Code review
        run: |
          mcode exec \
            --output-format json \
            --cwd "$GITHUB_WORKSPACE" \
            --timeout 10m \
            "Revisa los cambios de este PR siguiendo AGENTS.md (canvas 800x600, wrap toroidal, puntuación large=20/medium=50/small=100, cero dependencias, todo en un solo game.js). Reporta en español."
